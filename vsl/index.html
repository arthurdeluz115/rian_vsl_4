<style>
:root{
  --branco: #FFFFFF;
  --titulo: #030712;
  --suave: #6B7280;
  --linha: #E5E7EB;
  --alerta: #DC2626;
  --raio: 16px;
  --container: 400px;
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  background:var(--branco);
  color:var(--titulo);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  min-height:100svh;
  display:flex;
  align-items:flex-start;   /* topo (antes: center) — evita a página "pular" quando o título do vturb aparece */
  justify-content:center;
  padding:16px 0;
}

.vsl-wrap{
  width:100%;
  max-width:var(--container);
  padding:0 16px;
}

/* ---------- Label acima do vídeo ---------- */
.aviso-hoje{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  margin-bottom:10px;
  padding:11px 14px;
  border-radius:12px;
  background:#030712;
  color:#F3F4F6;
  font-size:14px;
  line-height:1.3;
  text-align:center;
}
.aviso-hoje strong{ color:#F87171; font-weight:800; }
.aviso-hoje-ponto{
  flex:0 0 auto;
  width:8px; height:8px;
  border-radius:50%;
  background:#EF4444;
  animation:pulsa 1.8s ease-in-out infinite;
}

.vsl-player{
  position:relative;
  width:100%;
  border-radius:var(--raio);
  overflow:hidden;
  background:#FFFFFF;
}
.vsl-player vturb-smartplayer{ display:block; width:100%; }
/* Reserva a altura do vídeo vertical (9:16) antes do vturb carregar.
   Sem isso a página "pula" quando o player aparece (era o CLS de 0,47). */
.vsl-player > vturb-smartplayer{ aspect-ratio:9/16; position:relative; z-index:1; }
/* Capa provisória (fundo branco + faixa preta 16:9): aparece na hora (melhora o LCP)
   e fica atrás do player, que a cobre quando carrega. Não precisa remover. */
.vsl-capa{ position:absolute; top:0; left:0; width:100%; height:auto; aspect-ratio:9/16; object-fit:cover; z-index:0; pointer-events:none; }

/* ---------- Gatilhos do vturb ("Mostrar conteúdo oculto") ----------
   Elementos vazios: o vturb troca o display:none deles no tempo configurado
   em cada vídeo, e o código percebe. Não aparecem para a pessoa. */
.gatilho-vturb{ height:0; margin:0; padding:0; overflow:hidden; }

/* ---------- Pessoas assistindo ao vivo ---------- */
.ao-vivo{
  position:absolute;
  left:12px;
  bottom:28px;               /* acima da barra de progresso; o JS sobe esse valor quando o botão aparece */
  transition:bottom .4s ease;
  z-index:999;
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(220,38,38,.78);   /* vermelho translúcido: ajuste o .78 se quiser mais/menos transparente */
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
  font-size:13px;
  line-height:1;
  color:#FFFFFF;
  pointer-events:none;       /* o clique passa direto para o player */
}
.ao-vivo strong{
  color:#FFFFFF;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.ao-vivo-ponto{
  width:8px; height:8px;
  border-radius:50%;
  background:#FFFFFF;
  animation:pulsa 1.8s ease-in-out infinite;
}
@keyframes pulsa{
  0%,100%{ opacity:1; transform:scale(1); }
  50%{ opacity:.35; transform:scale(.8); }
}

@keyframes bump{
  0%{ transform:scale(1); }
  40%{ transform:scale(1.12); }
  100%{ transform:scale(1); }
}

/* ---------- Vagas: cartão grande sobre o vídeo (gatilho mostrar-vagas) ---------- */
.vg{
  position:absolute;
  left:50%;
  bottom:140px;                 /* o JS recalcula para centralizar no vídeo, acima da área do botão */
  width:calc(100% - 32px);
  max-width:340px;
  z-index:999;
  padding:16px 18px 18px;
  border-radius:22px;
  background:rgba(3,7,18,.84);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 14px 44px rgba(0,0,0,.5);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  text-align:center;
  color:#FFFFFF;
  pointer-events:none;          /* o clique passa direto para o player */
  opacity:0;
  transform:translateX(-50%) scale(.94);
  transition:opacity .5s ease, transform .5s ease;
}
.vg[hidden]{ display:none; }
.vg.visivel{ opacity:1; transform:translateX(-50%) scale(1); }

.vg-topo{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-size:13px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:rgba(255,255,255,.88);
}
.vg-ponto{
  width:9px; height:9px;
  border-radius:50%;
  background:#EF4444;
  box-shadow:0 0 0 0 rgba(239,68,68,.7);
  animation:vg-pulsa 1.6s ease-out infinite;
}
@keyframes vg-pulsa{
  0%{ box-shadow:0 0 0 0 rgba(239,68,68,.7); }
  100%{ box-shadow:0 0 0 10px rgba(239,68,68,0); }
}

.vg-numero{
  margin:6px 0 2px;
  font-size:96px;
  font-weight:800;
  line-height:1;
  letter-spacing:-.02em;
  color:#FFFFFF;
  font-variant-numeric:tabular-nums;
  transition:color .3s ease, text-shadow .3s ease;
}
.vg-numero.baixo{
  color:#F87171;
  text-shadow:0 0 24px rgba(239,68,68,.55);
}
.vg-numero.bump{ animation:bump .4s ease; }

.vg-sub{
  font-size:14px;
  color:rgba(255,255,255,.7);
}
.vg-sub b{ color:#FFFFFF; font-weight:700; }

.vg-barra{
  margin:14px 0 12px;
  height:10px;
  border-radius:999px;
  background:rgba(255,255,255,.16);
  overflow:hidden;
}
.vg-barra i{
  display:block;
  height:100%;
  width:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#16A34A,#4ADE80);
  transition:width .6s ease;
}

.vg-rodape{
  font-size:13px;
  line-height:1.35;
  color:rgba(255,255,255,.82);
}

/* ---------- Vagas: caixinha embaixo do vídeo (gatilho mostrar-vagas-baixo) ---------- */
.vb{
  margin-top:14px;
  padding:14px 16px;
  border:1px solid #FECACA;
  background:#FEF2F2;
  border-radius:var(--raio);
  opacity:0;
  transform:translateY(6px);
  transition:opacity .5s ease, transform .5s ease;
}
.vb[hidden]{ display:none; }
.vb.visivel{ opacity:1; transform:none; }

.vb-topo{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:20px;
  font-weight:700;
  color:#7F1D1D;
}
.vb-rotulo{
  display:inline-flex;
  align-items:center;
  gap:9px;
}
.vb-ponto{
  flex:0 0 auto;
  width:9px; height:9px;
  border-radius:50%;
  background:#EF4444;
  box-shadow:0 0 0 0 rgba(239,68,68,.6);
  animation:vg-pulsa 1.6s ease-out infinite;
}
.vb-numero{
  font-size:36px;
  font-weight:800;
  line-height:1;
  color:#DC2626;
  font-variant-numeric:tabular-nums;
  transition:color .3s ease;
}
.vb-numero.baixo{ color:#B91C1C; }
.vb-numero.bump{ animation:bump .35s ease; }

.vb-barra{
  margin-top:10px;
  height:6px;
  border-radius:999px;
  background:#FECACA;
  overflow:hidden;
}
.vb-barra i{
  display:block;
  height:100%;
  width:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#EF4444,#DC2626);
  transition:width .6s ease;
}

/* ---------- Notificação de compra (topo do player) ---------- */
.notificacao{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  z-index:999;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:16px;
  background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  box-shadow:0 6px 20px rgba(0,0,0,.28);
  color:var(--titulo);
  pointer-events:none;
  opacity:0;
  transform:translateY(-14px);
  transition:opacity .35s ease, transform .35s ease;
}
.notificacao.visivel{ opacity:1; transform:none; }

.notificacao-icone{
  flex:0 0 auto;
  width:36px; height:36px;
  border-radius:10px;
  background:#16A34A;
  display:flex;
  align-items:center;
  justify-content:center;
}
.notificacao-icone svg{ width:20px; height:20px; display:block; }

.notificacao-corpo{ flex:1 1 auto; min-width:0; }
.notificacao-topo{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  line-height:1.2;
  color:var(--suave);
}
.notificacao-topo b{ color:var(--titulo); font-weight:700; }
.notificacao-texto{
  margin-top:2px;
  font-size:13px;
  line-height:1.3;
  color:var(--titulo);
}

@media (prefers-reduced-motion: reduce){
  .ao-vivo-ponto,
  .aviso-hoje-ponto,
  .vg-ponto,
  .vb-ponto,
  .vg-numero.bump,
  .vb-numero.bump{ animation:none; }
  .vg{ transition:opacity .2s ease; transform:translateX(-50%); }
  .vb{ transition:opacity .2s ease; transform:none; }
  .notificacao{ transition:opacity .2s ease; transform:none; }
}
</style>
</head>

<script>

// O script do player é montado a partir do id do <vturb-smartplayer>:
// "ab-..." = teste A/B, "vid-..." = vídeo único. Para trocar, basta colar o novo embed.
const CONTA_VTURB = '5c44636d-2807-4c36-8d21-6fb4390eaef0';
const PLAYER_EL = document.querySelector('.vsl-player > vturb-smartplayer');
const PLAYER_ID = PLAYER_EL ? PLAYER_EL.id : '';

function urlDoPlayer(id){
  if (id.indexOf('ab-') === 0) return 'https://scripts.converteai.net/' + CONTA_VTURB + '/ab-test/' + id.slice(3) + '/player.js';
  return 'https://scripts.converteai.net/' + CONTA_VTURB + '/players/' + id.replace('vid-', '') + '/v4/player.js';
}

const CONFIG = {
  checkoutUrl: 'https://app.ephra.io/checkout/5do1xf2',
  vslPlayerUrl: urlDoPlayer(PLAYER_ID)
};

// Data de hoje no label acima do vídeo (ex.: " (07/10)")
(function(){
  const el = document.getElementById('avisoData');
  if (!el) return;
  const d = new Date();
  el.textContent = ' (' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + ')';
})();

const s = document.createElement('script');
s.src = CONFIG.vslPlayerUrl;
s.async = true;
document.head.appendChild(s);

/* ============================================================
 * Checkout — preserva utm_*, fbclid, gclid e vk_source/vk_ad_id
 * (mantida caso o botão do vídeo use HTML customizado chamando
 * window.irParaCheckout(); se o botão usar o campo "Link" nativo
 * do vturb, essa função não é necessária)
 * ============================================================ */
function montarUrlCheckout(base){
  const destino = base || CONFIG.checkoutUrl;
  let url;
  try{ url = new URL(destino); } catch(e){ return destino; }

  new URLSearchParams(window.location.search).forEach((valor, chave) => {
    const k = chave.toLowerCase();
    if (k.startsWith('utm_') || k === 'fbclid' || k === 'gclid' || k === 'vk_source' || k === 'vk_ad_id') url.searchParams.set(chave, valor);
  });

  return url.toString();
}

function irParaCheckout(){
  window.location.href = montarUrlCheckout();
}
window.irParaCheckout = irParaCheckout;
</script>

  const elVb        = document.getElementById('vb');
  const elVbNumero  = document.getElementById('vbNumero');
  const elVbBarra   = document.getElementById('vbBarra');
  const elVbRotulo  = document.getElementById('vbRotulo');

  const gPitch  = document.querySelector('.' + C.gatilhos.pitch);
  const gGrande = document.querySelector('.' + C.gatilhos.vagasGrande);
  const gBaixo  = document.querySelector('.' + C.gatilhos.vagasBaixo);

  const rand = (min, max) => min + Math.random() * (max - min);
  const pad2 = n => String(n).padStart(2, '0');

  let videoEl = null;   // <video> real dentro do player (achado mais abaixo)

  /* ---------- tempo do vídeo ---------- */
  let tempo = 0;
  let tocando = false;
  let recebeuTimeupdate = false;
  let ultimoUpdate = 0;

  function lerTempo(arg){
    if (typeof arg === 'number') return arg;
    if (arg && typeof arg.currentTime === 'number') return arg.currentTime;
    if (arg && arg.detail){
      if (typeof arg.detail === 'number') return arg.detail;
      if (typeof arg.detail.currentTime === 'number') return arg.detail.currentTime;
    }
    return null;
  }

  function aoTimeupdate(arg){
    const t = lerTempo(arg);
    if (t === null || !isFinite(t)) return;
    recebeuTimeupdate = true;
    if (t !== tempo) tocando = true;   // o tempo avançou = o vídeo está tocando
    tempo = t;
    ultimoUpdate = Date.now();
    verificarGatilhos();
    renderVagas();
  }

  // Plano B: se o player não emitir timeupdate, lê o tempo do <video> ou conta com play/pause
  setInterval(() => {
    if (recebeuTimeupdate && tocando && Date.now() - ultimoUpdate > 2000){
      tocando = false;                 // tempo parou de avançar = pausado
    }
    if (!recebeuTimeupdate){
      if (videoEl && videoEl.currentTime > 0){
        tempo = videoEl.currentTime;
        tocando = !videoEl.paused;
      } else if (tocando){
        tempo += 1;
      }
    }
    renderVagas();
    armarBackredirect();
  }, 1000);

  // Duração real do vídeo que caiu no teste A/B (null se ainda não deu para ler)
  function duracaoVideo(){
    if (videoEl && isFinite(videoEl.duration) && videoEl.duration > 60) return videoEl.duration;
    return null;
  }

  /* ---------- pessoas assistindo ao vivo (112 -> 94) ---------- */
  let aoVivo = C.aoVivoInicio;

  function alvoAoVivo(){
    const dur = duracaoVideo() || C.duracaoReserva;
    const p = Math.min(1, Math.max(0, tempo / dur));
    return C.aoVivoInicio - (C.aoVivoInicio - C.aoVivoFim) * p;
  }

  function tickAoVivo(){
    if (tocando || tempo > 0){
      const alvo = Math.round(alvoAoVivo());
      let novo = aoVivo;

      if (aoVivo > alvo){
        novo -= (Math.random() < 0.25 ? 2 : 1);   // desce acompanhando a curva
      } else {
        const r = Math.random();                   // oscila perto da curva
        if (r < 0.25) novo -= 1;
        else if (r > 0.80) novo += 1;
      }

      novo = Math.max(C.aoVivoFim, Math.min(C.aoVivoInicio, novo));
      if (novo !== aoVivo){
        aoVivo = novo;
        elAoVivo.textContent = aoVivo;
      }
    }
    setTimeout(tickAoVivo, rand(3500, 8000));
  }
  tickAoVivo();

  /* ---------- notificações de compra (começam com o pitch) ---------- */
  const elNotif      = document.getElementById('notificacao');
  const elNotifNome  = document.getElementById('notifNome');
  const elNotifTempo = document.getElementById('notifTempo');
  let notifIniciado = false;
  let ultimoNome = null;

  function mostrarNotificacao(){
    const nomes = C.notificacoes.nomes;
    let nome;
    do { nome = nomes[Math.floor(Math.random() * nomes.length)]; }
    while (nome === ultimoNome && nomes.length > 1);
    ultimoNome = nome;

    elNotifNome.textContent = nome;
    elNotifTempo.textContent = Math.random() < 0.7 ? 'agora' : 'há ' + (1 + Math.floor(Math.random() * 3)) + ' min';

    log('notificação:', nome);
    elNotif.classList.add('visivel');
    setTimeout(() => elNotif.classList.remove('visivel'), C.notificacoes.duracao);
  }

  function agendarNotificacao(primeira){
    const espera = primeira ? rand(3000, 5000) : rand(C.notificacoes.intervaloMin, C.notificacoes.intervaloMax);
    setTimeout(() => {
      if (tocando) mostrarNotificacao();   // só aparece enquanto o vídeo está tocando
      agendarNotificacao(false);
    }, espera);
  }

  function iniciarNotificacoes(){
    if (notifIniciado) return;
    notifIniciado = true;
    log('iniciando notificações');
    agendarNotificacao(true);
  }

  /* ---------- gatilhos do vturb ---------- */
  let pitchAtivo = false;
  let vagasModo = null;   // null | 'grande' | 'baixo'

  function revelado(el){
    return !!el && window.getComputedStyle(el).display !== 'none';
  }

  function ativarPitch(){
    if (pitchAtivo) return;
    pitchAtivo = true;
    log('gatilho do pitch disparou em', Math.round(tempo) + 's');
    iniciarNotificacoes();
    ajustarAoVivo();
    posicionarVagasGrande();
    armarBackredirect();
  }

  function verificarGatilhos(){
    const grande = revelado(gGrande);
    const baixo  = revelado(gBaixo);

    if (!pitchAtivo && (revelado(gPitch) || grande || baixo)) ativarPitch();

    if (!vagasModo){
      if (grande) ativarVagas('grande');
      else if (baixo) ativarVagas('baixo');
    }
  }

  setInterval(verificarGatilhos, 300);

  /* ---------- vagas (49 -> 04, de 2 em 2 e 3 em 3) ---------- */
  // Sorteia uma sequência de passos 2 e 3 que soma exatamente 49 - 4 = 45
  function sortearPassos(total){
    const passos = [];
    let resto = total;
    while (resto > 0){
      let p = Math.random() < 0.5 ? 2 : 3;
      if (resto - p === 1) p = (p === 2 ? 3 : 2);  // evita sobrar 1
      if (p > resto) p = resto;                    // segurança
      passos.push(p);
      resto -= p;
    }
    return passos;
  }

  const passos = sortearPassos(C.vagasInicio - C.vagasFim);
  let momentos = [];
  let vagasAtual = null;

  function ativarVagas(modo){
    vagasModo = modo;

    // Distribui as quedas entre agora e o fim do vídeo, com tempos irregulares
    const inicio = tempo;
    const dur = duracaoVideo();
    const fim = (dur && dur - inicio > 10) ? dur : inicio + C.janelaReserva;
    const janela = (fim - inicio) * 0.96;
    momentos = passos
      .map((_, i) => inicio + ((i + 0.5 + rand(-0.35, 0.35)) / passos.length) * janela)
      .sort((a, b) => a - b);

    log('vagas (' + modo + ') a partir de', Math.round(inicio) + 's até', Math.round(fim) + 's');

    const el = modo === 'grande' ? elVg : elVb;
    el.hidden = false;
    if (modo === 'grande') posicionarVagasGrande();
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visivel')));

    renderVagas();
  }

  function renderVagas(){
    if (!vagasModo) return;

    let vagas = C.vagasInicio;
    for (let i = 0; i < momentos.length; i++){
      if (tempo >= momentos[i]) vagas -= passos[i];
    }
    vagas = Math.max(C.vagasFim, vagas);
    if (vagas === vagasAtual) return;

    const primeira = vagasAtual === null;
    vagasAtual = vagas;
    const baixo = vagas <= 10;
    const largura = Math.max(4, (vagas / C.vagasInicio) * 100) + '%';
    let elNumero;

    if (vagasModo === 'grande'){
      elNumero = elVgNumero;
      elVgBarra.style.width = largura;
      elVgRotulo.textContent = baixo ? 'Últimas vagas' : 'Vagas restantes';
      elVgRodape.textContent = baixo ? 'Está acabando! Garanta a sua antes que feche' : 'As vagas estão sendo preenchidas agora';
    } else {
      elNumero = elVbNumero;
      elVbBarra.style.width = largura;
      elVbRotulo.textContent = baixo ? 'Últimas vagas' : 'Vagas restantes';
    }

    elNumero.textContent = pad2(vagas);
    elNumero.classList.toggle('baixo', baixo);

    if (!primeira){
      elNumero.classList.remove('bump');
      void elNumero.offsetWidth;
      elNumero.classList.add('bump');
    }
  }

  /* ---------- posição dos elementos sobre o VÍDEO ---------- */
  const elNotifBox    = document.getElementById('notificacao');
  const BASE_AO_VIVO  = 28;   // distância do contador até o fundo do player, antes do botão aparecer
  const MARGEM_TOPO   = 20;   // distância da notificação até o topo do vídeo
  let avisouPlanoB = false;

  // Sobe o contador quando o botão do vturb aparece (pitch), para ele não ficar em cima
  function ajustarAoVivo(){
    const sobe = pitchAtivo ? C.aoVivoSobePx : 0;
    elAoVivoBox.style.bottom = (BASE_AO_VIVO + sobe) + 'px';
  }

  // Centraliza o cartão grande no VÍDEO. Depois do pitch o botão do vturb aparece
  // embaixo do vídeo e faz o player crescer, então essa área é descontada.
  function posicionarVagasGrande(){
    if (elVg.hidden) return;
    const larguraVideo = elWrapPlayer.getBoundingClientRect().width;
    if (!larguraVideo) return;
    const alturaVideo = larguraVideo * C.proporcaoVideo;
    const areaDoBotao = pitchAtivo ? C.aoVivoSobePx : 0;
    const alturaCard  = elVg.offsetHeight;
    const bottom = areaDoBotao + (alturaVideo - alturaCard) / 2;
    elVg.style.bottom = Math.max(areaDoBotao + 48, bottom) + 'px';
  }

  function acharVideo(no){
    if (!no || !no.querySelector) return null;
    const v = no.querySelector('video');
    if (v) return v;
    const todos = no.querySelectorAll('*');
    for (let i = 0; i < todos.length; i++){
      if (todos[i].shadowRoot){
        const achado = acharVideo(todos[i].shadowRoot);
        if (achado) return achado;
      }
    }
    return null;
  }

  function posicionarSobreVideo(){
    const base = elWrapPlayer.getBoundingClientRect();
    if (!base.width) return;

    if (!videoEl || !videoEl.isConnected){
      videoEl = acharVideo(elPlayer.shadowRoot) || acharVideo(elPlayer) || acharVideo(elWrapPlayer);
      if (videoEl) log('vídeo encontrado dentro do player');
    }

    let topoVideo;
    if (videoEl){
      const r = videoEl.getBoundingClientRect();
      if (r.height > 50) topoVideo = r.top - base.top;
    }

    if (topoVideo === undefined){
      // Plano B: não achou o <video>; usa o deslocamento manual
      if (!avisouPlanoB){ avisouPlanoB = true; log('vídeo NÃO encontrado, usando plano B (topoVideoManual)'); }
      topoVideo = C.topoVideoManual || 0;
    }

    elNotifBox.style.top = Math.max(0, topoVideo + MARGEM_TOPO) + 'px';
    posicionarVagasGrande();
  }

  posicionarSobreVideo();
  window.addEventListener('resize', posicionarSobreVideo);
  window.addEventListener('load', posicionarSobreVideo);
  setInterval(posicionarSobreVideo, 500);   // acompanha o título/botão do vturb aparecendo e mudando de tamanho

  /* ---------- backredirect (botão voltar -> /back/) ---------- */
  const BR = C.backredirect;
  let brArmado = false;
  let interagiu = false;

  function brLiberado(){ return BR.inicio === null ? pitchAtivo : tempo >= BR.inicio; }

  // Leva a query string inteira (utm_*, fbclid, gclid, sck, vk_*...) para a /back/ repassar ao checkout
  function urlBack(){ return BR.destino + window.location.search; }

  // O Chrome ignora entradas de histórico criadas sem interação do usuário,
  // então só "armamos" depois de um toque/clique/tecla na página.
  function armarBackredirect(){
    if (!BR.ativo || brArmado || !interagiu || !brLiberado()) return;
    brArmado = true;
    try { history.pushState({ backredirect: true }, '', location.href); } catch(e){}
    log('backredirect armado');
  }

  ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev => {
    window.addEventListener(ev, () => { interagiu = true; armarBackredirect(); }, { passive: true });
  });

  window.addEventListener('popstate', () => {
    if (!brArmado) return;
    brArmado = false;
    try { if (window.fbq) fbq('trackCustom', 'BackRedirect'); } catch(e){}
    log('backredirect -> ' + urlBack());
    window.location.replace(urlBack());   // replace: o "voltar" da /back/ não cai de novo nesta página
  });

  /* ---------- conexão com o player do vturb ---------- */
  // No teste A/B o vturb cria um player interno com o id do vídeo sorteado,
  // então além do elemento principal também procuramos qualquer
  // <vturb-smartplayer> dentro do container e as instâncias globais.
  let conectado = false;

  function acharInstancia(){
    if (elPlayer && typeof elPlayer.on === 'function') return elPlayer;
    const internos = elWrapPlayer.querySelectorAll('vturb-smartplayer');
    for (let i = 0; i < internos.length; i++){
      if (typeof internos[i].on === 'function') return internos[i];
    }
    if (window.smartplayer && window.smartplayer.instances && window.smartplayer.instances[0]) return window.smartplayer.instances[0];
    return null;
  }

  function conectar(){
    if (conectado) return true;

    const inst = acharInstancia();
    if (!inst || typeof inst.on !== 'function') return false;

    inst.on('timeupdate', aoTimeupdate);
    inst.on('play',  () => { tocando = true;  log('play'); });
    inst.on('pause', () => { tocando = false; log('pause'); });
    inst.on('ended', () => { tocando = false; log('ended'); });

    conectado = true;
    log('conectado ao player');
    return true;
  }

  if (elPlayer) elPlayer.addEventListener('player:ready', conectar);
  document.addEventListener('player:ready', conectar);

  verificarGatilhos();

  let tentativas = 0;
  const poll = setInterval(() => {
    tentativas++;
    if (conectar() || tentativas > 120) clearInterval(poll);
  }, 500);
})();
</script>

</body>
</html>
